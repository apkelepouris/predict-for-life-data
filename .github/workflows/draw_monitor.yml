name: Predict For Life - Draw Monitor

on:

  # Allows us to run it manually
  workflow_dispatch:

  # Automatic schedule (UTC time)
  schedule:
    - cron: "*/15 18-20 * * 1,4"
    - cron: "0 */6 * * 0,2,3,5,6"

jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automation
        run: |
          python -m automation.main

      - name: Check for database changes
        id: changes
        run: |
          if git diff --quiet set_for_life.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi