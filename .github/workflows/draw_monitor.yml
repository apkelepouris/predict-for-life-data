name: Predict For Life - Draw Monitor

on:

  # Allows us to run it manually
  workflow_dispatch:

  # Automatic schedule (UTC time)
  schedule:
    - cron: "*/15 18-20 * * 1,4"
    - cron: "0 */6 * * 0,2,3,5,6"

permissions:
  contents: write

jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automation
        run: |
          python -m automation.main

      - name: Check for database changes
        id: changes
        run: |
          if git diff --quiet set_for_life.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated database
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add set_for_life.csv
          git commit -m "Add latest Set For Life draw"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin HEAD