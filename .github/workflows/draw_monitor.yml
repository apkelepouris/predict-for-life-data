name: Predict For Life - Draw Monitor

on:

  # Allows us to run it manually
  workflow_dispatch:

  # Automatic schedule
  schedule:

    # Mondays & Thursdays
    # Multiple irregular launch opportunities.
    # The first successful run starts the
    # long-running Python monitor.
    - cron: "43,53 19 * * 1,4"
      timezone: "Europe/London"

    - cron: "3,13 20 * * 1,4"
      timezone: "Europe/London"

    # Late draw-day recovery safety net.
    - cron: "13 23 * * 1,4"
      timezone: "Europe/London"

    # Heartbeat on non-draw days.
    - cron: "14 12 * * 0,2,3,5,6"
      timezone: "Europe/London"

concurrency:
  group: predict-for-life-draw-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automation
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          python -m automation.main

      - name: Check for persistent changes
        id: changes
        run: |
          if git diff --quiet -- set_for_life.csv automation/state/monitoring_state.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit persistent changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add set_for_life.csv automation/state/monitoring_state.json
          git commit -m "Update Predict For Life monitoring state"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin HEAD